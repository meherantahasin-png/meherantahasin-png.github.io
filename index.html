<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meheran Tahasin | Personal Website</title>
  <meta name="description" content="The personal website of Meheran Tahasin, a student from Bangladesh interested in technology and computer science.">
  <meta name="author" content="Meheran Tahasin">
  <meta name="theme-color" content="#071426">

  <link rel="canonical" href="https://meherantahasin-png.github.io/">

  <meta property="og:title" content="Meheran Tahasin">
  <meta property="og:description" content="A curious mind, an endless list of things to explore.">
  <meta property="og:url" content="https://meherantahasin-png.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://meherantahasin-png.github.io/profile.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Meheran Tahasin">
  <meta name="twitter:description" content="Personal website of Meheran Tahasin.">
  <meta name="twitter:image" content="https://meherantahasin-png.github.io/profile.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Meheran Tahasin",
    "url": "https://meherantahasin-png.github.io/",
    "image": "https://meherantahasin-png.github.io/profile.jpg",
    "email": "meherantahasin@gmail.com",
    "description": "A Bangladeshi student interested in technology and computer science."
  }
  </script>

  <style>
    :root {
      --bg: #071426;
      --blue: #69b4ff;
      --white: #f5f8ff;
      --muted: #b6c5d8;
      --border: rgba(255,255,255,0.13);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Background video */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: var(--bg);
    }

    .background video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.48;
      filter: brightness(0.72) saturate(0.85);
      transform: scale(1.02);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          115deg,
          rgba(4, 15, 32, 0.82) 0%,
          rgba(5, 24, 48, 0.58) 48%,
          rgba(5, 17, 37, 0.78) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(4, 13, 28, 0.22),
          rgba(4, 13, 28, 0.55)
        );
      z-index: 1;
    }

    /* Navigation */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s ease;
    }

    header.scrolled {
      background: rgba(5, 17, 35, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .logo span {
      color: var(--blue);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    nav a {
      color: var(--muted);
      font-size: 14px;
      transition: 0.25s;
    }

    nav a:hover {
      color: var(--white);
    }

    /* Hero */

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 22px 90px;
    }

    .hero {
      max-width: 800px;
      animation: appear 1.1s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--blue);
      opacity: 0.7;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 86px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -1.8px;
      margin-bottom: 20px;
    }

    h1 span {
      color: var(--blue);
    }

    .intro {
      max-width: 540px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 38px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 145px;
      padding: 14px 25px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .btn-primary {
      background: var(--blue);
      color: #061426;
      border: 1px solid var(--blue);
    }

    .btn-primary:hover {
      background: #91caff;
      border-color: #91caff;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(77, 163, 255, 0.2);
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--white);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--white);
      transform: translateY(-3px);
    }

    /* Footer */

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 22px;
      text-align: center;
      color: rgba(220, 232, 247, 0.58);
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    /* Animation */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      header {
        padding: 18px 6%;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 12px;
      }

      .logo {
        font-size: 18px;
      }

      main {
        padding-top: 110px;
        padding-bottom: 100px;
      }

      h1 {
        font-size: clamp(43px, 12vw, 65px);
      }

      .intro {
        font-size: 14px;
        max-width: 340px;
      }

      .buttons {
        gap: 12px;
      }

      .btn {
        min-width: 135px;
        padding: 13px 19px;
        font-size: 13px;
      }

      .background video {
        opacity: 0.52;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Background video -->
  <div class="background">
    <video autoplay muted loop playsinline preload="metadata" poster="profile.jpg">
      <source src="972.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Navigation -->
  <header id="header">
    <a href="index.html" class="logo">Meheran<span>.</span></a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <section class="hero">

      <div class="eyebrow">Welcome to my space</div>

      <h1>
        Meheran<br>
        <span>Tahasin.</span>
      </h1>

      <p class="intro">
        A student from Bangladesh with an interest in technology,
        computer science, and everything worth exploring.
      </p>

      <div class="buttons">
        <a href="about.html" class="btn btn-primary">
          More About Me
        </a>

        <a href="contact.html" class="btn btn-secondary">
          Get in touch
        </a>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer>
    © <span id="year"></span> Meheran Tahasin. All rights reserved.
  </footer>

  <script>
    // Dynamic copyright year
    document.getElementById("year").textContent =
      new Date().getFullYear();

    // Header background on scroll
    const header = document.getElementById("header");

    window.addEventListener("scroll", () => {
      header.classList.toggle("scrolled", window.scrollY > 30);
    });
  </script>

  <!-- AI Assistant: keep chatbot.js in the repository root -->
  <script src="chatbot.js" defer></script>

</body>
</html>
