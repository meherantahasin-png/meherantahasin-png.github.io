<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meheran Tahasin | Personal Website</title>
  <meta name="description" content="The personal website of Meheran Tahasin. Student, technology enthusiast, and aspiring computer scientist.">
  <meta name="author" content="Meheran Tahasin">
  <meta name="theme-color" content="#090a0d">

  <link rel="canonical" href="https://meherantahasin-png.github.io/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Meheran Tahasin">

  <meta property="og:url" content="https://meherantahasin-png.github.io/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0d;
      --surface: #111318;
      --gold: #c7a77a;
      --white: #f4f1eb;
      --muted: #a09da0;
      --border: rgba(255,255,255,.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 88%);
      margin: auto;
    }

    /* Navigation */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 24px 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
      font-size: 13px;
      color: #ddd;
    }

    .nav-links a {
      transition: color .3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* Hero */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #101116;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: .48;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(9,10,13,.95), rgba(9,10,13,.45)),
        linear-gradient(0deg, var(--bg), transparent 45%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding-top: 70px;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 88px);
      font-weight: 500;
      line-height: 1.12;
      max-width: 800px;
    }

    h1 span {
      color: var(--gold);
    }

    .hero-description {
      color: #d0cdd0;
      max-width: 520px;
      margin-top: 25px;
      font-size: 16px;
    }

    .hero-button {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 26px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 1px;
      transition: .3s;
    }

    .hero-button:hover {
      background: var(--gold);
      color: var(--bg);
    }

    /* Footer */

    footer {
      padding: 25px 0;
      text-align: center;
      color: #777;
      font-size: 11px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    /* Mobile */

    @media (max-width: 700px) {
      header {
        padding: 18px 0;
      }

      .nav-links {
        gap: 15px;
        font-size: 11px;
      }

      .logo {
        font-size: 18px;
      }

      .hero {
        min-height: 90vh;
      }

      .hero-overlay {
        background:
          linear-gradient(90deg, rgba(9,10,13,.88), rgba(9,10,13,.55)),
          linear-gradient(0deg, var(--bg), transparent 65%);
      }

      .hero-description {
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .nav-links {
        gap: 10px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }

      .hero-video {
        display: none;
      }
    }
  </style>

  <script type="application/ld+json">

    ]
  }
  </script>
</head>

<body>

  <!-- NAVIGATION -->

  <header>

  <main>

    <!-- HERO -->

    <section class="hero" id="home">

      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        poster="profile.jpg"
        aria-hidden="true">

        <source src="972.mp4" type="video/mp4">
      </video>

      <div class="hero-overlay"></div>

      <div class="container hero-content">

        <p class="eyebrow">Personal Website</p>

        <h1>
          Meheran<br>
          <span>Tahasin.</span>
        </h1>

        <p class="hero-description">
          A curious mind, an endless list of things to explore,
          and a life full of possibilities.
        </p>

        <a href="about.html" class="hero-button">
          EXPLORE MY WORLD
        </a>

      </div>
    </section>

  </main>

  <!-- FOOTER -->

  <footer>
    <div class="container">
      © <span id="year"></span> Meheran Tahasin. All rights reserved.
    </div>
  </footer>

  </script>

</html>
